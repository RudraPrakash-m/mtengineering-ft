        <h2>Precision Physical Scale Models &amp; Heavy Structural Execution in Bhubaneswar</h2>
        <p>
          Established in 2006 in Jaydev Vihar, Bhubaneswar, MT Engineering &amp; Construction is Odisha's premier
          multi-disciplinary contractor. We combine sub-millimeter architectural physical scale model fabrication with
          full-scale structural steel assembly and post-tensioned RCC slab casting.
        </p>
        <h2>Our Core Engineering Disciplines</h2>
        <p>
          Our firm delivers end-to-end structural and scale modeling solutions across Bhubaneswar, Cuttack, Paradeep,
          and Eastern India. Utilizing 5-axis CNC machining, high-resolution laser cutters, and automated submerged-arc
          steel welders, we maintain strict tolerance standards within ±0.05 mm.
        </p>
        <ul>
          <li><strong>Architectural Scale Models:</strong> Presentation and competition models at scales from 1:50 to
            1:500 with integrated 3000K LED illumination.</li>
          <li><strong>Structural Steel Fabrication:</strong> Heavy industrial trusses, PEB frameworks, and hospital ICU
            extensions executed at our Mancheswar facility.</li>
          <li><strong>RCC Slab Contracting:</strong> Post-tensioned commercial floor slabs, tendon prestressing, and
            high-strength concrete quality control.</li>
          <li><strong>Urban Topography Masterplans:</strong> Multi-acre city masterplans with zoning LED indicators and
            topographical contour slices.</li>
        </ul>
        <h2>Contact Our Bhubaneswar Atelier</h2>
        <p>
          Head Office: Plot No-65/4430, Mayfair Road, Near Mayfair Spa Gate, Jaydev Vihar, Bhubaneswar, Odisha – 751013.
          Phone: +91 94370 12890. Email: inquiry@mtengineering.in.
        </p>
